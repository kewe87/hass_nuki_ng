bridge_reboot:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: nuki_ng

bridge_fwupdate:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: nuki_ng

bridge_delete_callback:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: nuki_ng
    command:
      required: true
      example: "http://192.168.0.0/callback"
      selector:
        text: {}
execute_action:
  target:
    entity:
      integration: nuki_ng
  fields:
    action:
      example: unlock
      required: true
      selector:
        select:
          options:
            - unlock
            - lock
            - open
            - lock_n_go
            - lock_n_go_open
            - activate_rto
            - deactivate_rto
            - electric_strike_actuation
            - activate_continuous_mode
            - deactivate_continuous_mode
